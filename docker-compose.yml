version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: coub_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-filedb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coub_network

  redis:
    image: redis:7-alpine
    container_name: coub_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - coub_network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: coub_backend
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./frontend:/app/frontend
      - ./backend/app:/app/backend/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DOWNLOAD_FOLDER=${DOWNLOAD_FOLDER}
#      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SECRET_KEY=${SECRET_KEY}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - coub_network

  celery_worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: coub_celery
    volumes:
      - ./downloads:/app/downloads
      - ./backend/app:/app/backend/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DOWNLOAD_FOLDER=${DOWNLOAD_FOLDER}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.app.celery_app worker --loglevel=info -E --concurrency=2
    restart: unless-stopped
    networks:
      - coub_network

  # Опционально: Flower для мониторинга Celery
  # flower:
  #   build:
  #     context: .
  #     dockerfile: ./backend/Dockerfile
  #   container_name: coub_flower
  #   ports:
  #     - "5555:5555"
  #   environment:
  #     - CELERY_BROKER_URL=${CELERY_BROKER_URL}
  #     - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
  #   depends_on:
  #     - redis
  #     - celery_worker
  #   command: celery -A backend.app.celery_app flower --port=5555
  #   restart: unless-stopped
  #   networks:
  #     - coub_network

volumes:
  postgres_data:
    driver: local

networks:
  coub_network:
    driver: bridge